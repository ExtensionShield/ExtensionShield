<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <title>ExtensionShield</title>
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="light">
  <div class="app">
    <div class="app-inner" data-tab="extensions">
      
      <!-- Top Header -->
      <header class="header">
        <div class="brand">
          <img src="icons/logo.svg" alt="" class="brand-icon">
          <span class="brand-name">ExtensionShield</span>
        </div>
        <div class="header-actions">
          <span id="extCountBadge" class="header-count-pill">—</span>
          <button type="button" class="header-action-btn" id="openWebDashboardBtn" title="Open Web Dashboard (Local)" aria-label="Open Web Dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <path d="M9 3v18M3 9h6" />
            </svg>
          </button>
          <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
            <span class="theme-icon-light" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            </span>
            <span class="theme-icon-dark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </span>
          </button>
        </div>
      </header>

      <!-- Segmented Pill Tabs -->
      <div class="segmented-control">
        <button type="button" class="segment-btn active" id="tabExtensions" data-tab="extensions">Extensions</button>
        <button type="button" class="segment-btn" id="tabAlerts" data-tab="alerts">
          Alerts <span id="alertsBadge" class="segment-badge" hidden>0</span>
        </button>
        <button type="button" class="segment-btn" id="tabScanUrl" data-tab="scanurl">Scan URL</button>
      </div>

      <!-- Main Content Panes -->
      <div class="panes">
        
        <!-- PANE 1: EXTENSIONS -->
        <div id="paneExtensions" class="pane active">
          
          <!-- Unified Search & Filter Toolbar -->
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-box-icon"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
            <input type="text" id="extSearchInput" class="search-box-input" placeholder="Search installed extensions…" autocomplete="off">
          </div>

          <!-- Category Filter Pills -->
          <div class="filter-pills" id="statsStrip">
            <button type="button" class="filter-pill active" data-filter="all">All <span id="statAllCount">0</span></button>
            <button type="button" class="filter-pill pill-safe" data-filter="safe">Safe <span id="statSafeCount">0</span></button>
            <button type="button" class="filter-pill pill-warn" data-filter="warn">Review <span id="statWarnCount">0</span></button>
            <button type="button" class="filter-pill pill-high" data-filter="high">High Risk <span id="statHighCount">0</span></button>
          </div>

          <div id="status" class="status" hidden>
            <div class="spinner"></div>
            <span id="statusText">Scanning…</span>
          </div>

          <div id="content" class="content">
            <div id="rows" class="ext-list"></div>
          </div>
        </div>

        <!-- PANE 2: ALERTS -->
        <div id="paneAlerts" class="pane">
          <div class="alerts-pane">
            <div class="alerts-toolbar">
              <span class="alerts-toolbar-title">Security & Audit Alerts</span>
              <div class="alerts-toolbar-actions">
                <button type="button" id="alertsSettingsToggle" class="icon-btn" title="Alert Settings" aria-label="Alert Settings">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
                <button type="button" id="alertsClearBtn" class="icon-btn" title="Clear History" aria-label="Clear History">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
              </div>
            </div>

            <div id="alertsSettingsDrawer" class="alerts-settings-drawer" hidden>
              <div class="settings-group">
                <label class="setting-item">
                  <span class="setting-label">Desktop Notifications</span>
                  <input type="checkbox" id="settingEnableNotifs" class="setting-checkbox">
                </label>
                <label class="setting-item">
                  <span class="setting-label">High-Risk Threats Only</span>
                  <input type="checkbox" id="settingHighRiskOnly" class="setting-checkbox">
                </label>
                <label class="setting-item">
                  <span class="setting-label">Instant Permission Warnings</span>
                  <input type="checkbox" id="settingInstantHeuristics" class="setting-checkbox">
                </label>
              </div>
            </div>

            <div id="alertsList" class="alerts-list"></div>

            <div id="alertsEmptyState" class="alerts-empty-state" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="36" height="36" class="empty-icon"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              <p class="empty-title">All Clear</p>
              <p class="empty-desc">No security alerts or dangerous extension installs detected.</p>
            </div>
          </div>
        </div>

        <!-- PANE 3: SCAN URL -->
        <div id="paneScanUrl" class="pane">
          <div class="scan-url-pane">
            <div class="scan-search-container" id="scanSearchContainer">
              <span class="scan-search-chrome-icon" aria-hidden="true">
                <img src="icons/chrome.svg" alt="" width="18" height="18" class="scan-search-chrome-logo">
              </span>
              <input type="text" id="scanUrlInput" class="scan-search-input" placeholder="Search name or paste Chrome Web Store URL" autocomplete="off">
              <button type="button" id="scanUrlSubmit" class="scan-search-btn" aria-label="Scan extension">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
              </button>
            </div>
            <div id="scanUrlMessage" class="scan-url-message" role="status" aria-live="polite"></div>
            <div id="scanResultsContent" class="scan-results-content" hidden>
              <div id="scanResultRows" class="ext-list"></div>
            </div>
            <a href="https://extensionshield.com/scan" target="_blank" rel="noopener noreferrer" class="scan-url-detail-link">
              Detailed results available on site ↗
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
